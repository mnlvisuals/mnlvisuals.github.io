<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #enter {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      cursor: pointer;
      z-index: 10;
      user-select: none;
      letter-spacing: 0.18em;
      font-size: clamp(18px, 2vw, 30px);
    }

    #player-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-width: 177.78vh;
      min-height: 100vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="enter">CLICK TO ENTER</div>
  <div id="player-wrap">
    <div id="player"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const VIDEO_ID = "mUa2zFLAuTw";
    let player;
    let ready = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          iv_load_policy: 3,
          origin: window.location.origin
        },
        events: {
          onReady: function () {
            ready = true;
            player.setLoop(true);
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.ENDED) {
              player.seekTo(0);
              player.playVideo();
            }
          }
        }
      });
    }

    document.getElementById("enter").addEventListener("click", function () {
      if (!ready) return;

      player.unMute();
      player.setVolume(100);
      player.playVideo();

      this.style.display = "none";
    });
  </script>
</body>
</html>
