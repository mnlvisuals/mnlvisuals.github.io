<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #player-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-width: 177.78vh;
      min-height: 100vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #enter {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      cursor: pointer;
      z-index: 30;
      user-select: none;
      letter-spacing: .18em;
      font-size: clamp(18px, 2vw, 30px);
    }

    #gear {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 20;
      display: none;
      backdrop-filter: blur(8px);
    }

    #settings {
      position: fixed;
      right: 18px;
      bottom: 72px;
      width: 240px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 12px;
      background: rgba(15,15,15,.92);
      color: #fff;
      z-index: 20;
      display: none;
      box-sizing: border-box;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    .row {
      margin-bottom: 13px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 12px;
      opacity: .72;
      margin-bottom: 6px;
    }

    select, button.toggle, input[type="range"] {
      width: 100%;
    }

    select, button.toggle {
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      background: #1d1d1d;
      color: white;
      padding: 9px 10px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button.toggle {
      cursor: pointer;
    }

    .note {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.35;
      opacity: .55;
    }
  </style>
</head>
<body>
  <div id="player-wrap"><div id="player"></div></div>

  <div id="enter">CLICK TO ENTER</div>

  <button id="gear" aria-label="Settings">⚙</button>

  <div id="settings">
    <div class="row">
      <label for="quality">Resolution</label>
      <select id="quality">
        <option value="auto">Auto</option>
        <option value="hd1080">1080p</option>
        <option value="hd720">720p</option>
        <option value="large">480p</option>
        <option value="medium">360p</option>
        <option value="small">240p</option>
      </select>
    </div>

    <div class="row">
      <label>Subtitles</label>
      <button class="toggle" id="captions">Off</button>
    </div>

    <div class="row">
      <label for="volume">Volume</label>
      <input id="volume" type="range" min="0" max="100" value="100" />
    </div>

    <div class="note">
      YouTube may override a manually selected resolution because its embedded player uses adaptive streaming.
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const VIDEO_ID = "mUa2zFLAuTw";

    let player;
    let ready = false;
    let captionsOn = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0,
          playsinline: 1,
          iv_load_policy: 3,
          cc_load_policy: 0
        },
        events: {
          onReady: function () {
            ready = true;
            try {
              player.loadModule("captions");
              player.setOption("captions", "track", {});
            } catch (e) {}
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.ENDED) {
              player.seekTo(0, true);
              player.playVideo();
            }
          }
        }
      });
    }

    document.getElementById("enter").addEventListener("click", function () {
      if (!ready) return;

      try {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      } catch (e) {}

      this.style.display = "none";
      document.getElementById("gear").style.display = "block";
    });

    const gear = document.getElementById("gear");
    const settings = document.getElementById("settings");

    gear.addEventListener("click", function (e) {
      e.stopPropagation();
      settings.style.display =
        settings.style.display === "block" ? "none" : "block";
    });

    settings.addEventListener("click", function (e) {
      e.stopPropagation();
    });

    document.addEventListener("click", function () {
      settings.style.display = "none";
    });

    document.getElementById("quality").addEventListener("change", function () {
      if (!ready) return;
      const q = this.value;

      try {
        if (q === "auto") {
          // Let YouTube choose automatically.
          if (player.setPlaybackQualityRange) {
            player.setPlaybackQualityRange("tiny", "highres");
          }
        } else {
          // YouTube may choose to ignore this request in modern embeds.
          if (player.setPlaybackQuality) {
            player.setPlaybackQuality(q);
          }
          if (player.setPlaybackQualityRange) {
            player.setPlaybackQualityRange(q, q);
          }
        }
      } catch (e) {}
    });

    document.getElementById("captions").addEventListener("click", function () {
      if (!ready) return;

      captionsOn = !captionsOn;

      try {
        player.loadModule("captions");

        if (captionsOn) {
          const tracks = player.getOption("captions", "tracklist") || [];
          if (tracks.length) {
            player.setOption("captions", "track", tracks[0]);
          }
        } else {
          player.setOption("captions", "track", {});
          player.unloadModule("captions");
        }
      } catch (e) {}

      this.textContent = captionsOn ? "On" : "Off";
    });

    document.getElementById("volume").addEventListener("input", function () {
      if (!ready) return;
      const v = Number(this.value);

      try {
        player.setVolume(v);
        if (v === 0) player.mute();
        else player.unMute();
      } catch (e) {}
    });
  </script>
</body>
</html>
