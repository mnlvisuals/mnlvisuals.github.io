<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #enter {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      cursor: pointer;
      z-index: 10;
      user-select: none;
      letter-spacing: 0.18em;
      font-size: clamp(18px, 2vw, 30px);
    }

    #video-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-width: 177.78vh;
      min-height: 100vh;
      transform: translate(-50%, -50%);
      border: 0;
    }
  </style>
</head>
<body>
  <div id="video-wrap">
    <iframe
      id="video"
      src="https://streamable.com/e/v1ivyr?autoplay=0&loop=1&muted=0"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <div id="enter">CLICK TO ENTER</div>

  <script>
    const enter = document.getElementById("enter");
    const video = document.getElementById("video");

    enter.addEventListener("click", () => {
      video.src = "https://streamable.com/e/v1ivyr?autoplay=1&loop=1&muted=0";
      enter.style.display = "none";
    });
  </script>
</body>
</html>
